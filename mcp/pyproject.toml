[project]
name = "clipgringa-mcp"
version = "0.1.0"
description = "Model Context Protocol server for ClipGringa — turn long videos into viral short clips."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "ClipGringa" }]
keywords = ["mcp", "clipgringa", "video", "clips", "ai"]
dependencies = [
    "mcp[cli]>=1.4.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.scripts]
clipgringa-mcp = "clipgringa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipgringa_mcp"]
